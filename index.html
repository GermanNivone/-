<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кадермятов Ханиф — Я создаю стильные сайты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0e0d12;
    --champagne: #f2d9c0;
    --champagne-soft: #dbb594;
    --gold: #c9a25f;
    --gold-bright: #e9c98a;
    --ink: #08070a;
    --card-border: rgba(242, 217, 192, 0.14);
    --card-bg: rgba(255, 255, 255, 0.045);
    --space-1: 8px;
    --space-2: 16px;
    --space-3: 24px;
    --space-4: 32px;
    --space-5: 40px;
    --space-6: 48px;
    --space-8: 64px;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
  }

  body{
    min-height: 100svh;
    background: var(--bg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--champagne);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-4) var(--space-2);
    position: relative;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Атмосфера фона ---------- */

  body::before{
    /* глубинные свечения по всему экрану */
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(560px 420px at 12% 8%, rgba(201, 162, 95, 0.16), transparent 60%),
      radial-gradient(620px 480px at 88% 92%, rgba(219, 181, 148, 0.12), transparent 60%),
      radial-gradient(900px 700px at 50% 50%, rgba(30, 26, 34, 0.6), var(--bg) 70%);
    pointer-events: none;
  }

  body::after{
    /* текстура шума */
    content: "";
    position: fixed;
    inset: -100px;
    z-index: 1;
    opacity: 0.05;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size: 180px 180px;
    mix-blend-mode: overlay;
  }

  /* ---------- Карточка ---------- */

  .card{
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 460px;
    padding: var(--space-6) var(--space-5) var(--space-5);
    border-radius: 28px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(28px) saturate(140%);
    -webkit-backdrop-filter: blur(28px) saturate(140%);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.06) inset,
      0 40px 80px -30px rgba(0,0,0,0.7);
    overflow: hidden;
    transition: transform 0.5s cubic-bezier(0.19,1,0.22,1), box-shadow 0.5s cubic-bezier(0.19,1,0.22,1);
    animation: float 8s ease-in-out infinite;
  }

  .card:hover{
    transform: translateY(-6px);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.08) inset,
      0 55px 100px -30px rgba(0,0,0,0.8);
  }

  /* свечения по углам карточки */
  .card::before{
    content: "";
    position: absolute;
    top: -40%;
    left: -30%;
    width: 70%;
    height: 70%;
    background: radial-gradient(circle, rgba(233,201,138,0.25), transparent 70%);
    pointer-events: none;
    z-index: -1;
  }

  .card::after{
    content: "";
    position: absolute;
    bottom: -40%;
    right: -30%;
    width: 70%;
    height: 70%;
    background: radial-gradient(circle, rgba(219,181,148,0.18), transparent 70%);
    pointer-events: none;
    z-index: -1;
  }

  /* ---------- Эйбрau / метка ---------- */

  .eyebrow{
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--champagne-soft);
    opacity: 0.75;
    margin-bottom: var(--space-4);
  }

  .eyebrow .dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold-bright);
    box-shadow: 0 0 8px 1px rgba(233,201,138,0.8);
    animation: pulse 3s ease-in-out infinite;
  }

  /* ---------- Имя ---------- */

  .name{
    margin: 0;
    font-size: clamp(38px, 9vw, 52px);
    font-weight: 800;
    line-height: 1.02;
    letter-spacing: 0.01em;
    color: var(--champagne);
    text-shadow: 0 0 40px rgba(242,217,192,0.12);
  }

  .name .last{
    display: block;
    letter-spacing: 0.04em;
    color: var(--gold-bright);
    background: linear-gradient(180deg, #f7e7d1 0%, #c9a25f 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* ---------- Роль / фраза ---------- */

  .role{
    margin: var(--space-4) 0 var(--space-5);
    padding: var(--space-1) 0 var(--space-1) var(--space-3);
    border-left: 2px solid var(--gold);
    font-size: 17px;
    font-weight: 500;
    line-height: 1.5;
    background: linear-gradient(90deg, #f2d9c0 0%, #dbb594 55%, #c9a25f 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* ---------- Кнопка ---------- */

  .cta{
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-1);
    width: auto;
    padding: 16px 28px;
    border-radius: 100px;
    background: linear-gradient(180deg, #f7e9d6, var(--champagne-soft));
    color: var(--ink);
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.01em;
    text-decoration: none;
    border: none;
    cursor: pointer;
    overflow: hidden;
    isolation: isolate;
    transition: transform 0.35s cubic-bezier(0.19,1,0.22,1), box-shadow 0.35s cubic-bezier(0.19,1,0.22,1);
    box-shadow: 0 8px 24px -8px rgba(242,217,192,0.35);
  }

  .cta .arrow{
    display: inline-block;
    width: 0;
    opacity: 0;
    overflow: hidden;
    transform: translateX(-6px);
    transition: width 0.35s ease, opacity 0.35s ease, transform 0.35s ease;
  }

  .cta:hover{
    transform: translateY(-4px) scale(1.035);
    box-shadow: 0 16px 34px -10px rgba(242,217,192,0.5);
  }

  .cta:hover .arrow{
    width: 18px;
    opacity: 1;
    transform: translateX(0);
  }

  .cta:active{
    transform: translateY(-1px) scale(1.01);
  }

  .cta:focus-visible{
    outline: 2px solid var(--gold-bright);
    outline-offset: 3px;
  }

  @keyframes float{
    0%, 100%{
      transform: translateY(0);
    }
    50%{
      transform: translateY(-8px);
    }
  }

  @keyframes glow{
    0%{
      box-shadow: 0 8px 24px -8px rgba(242,217,192,0.35);
    }
    100%{
      box-shadow: 0 14px 34px -10px rgba(242,217,192,0.55);
    }
  }

  @keyframes pulse{
    0%, 100%{
      transform: scale(1);
      box-shadow: 0 0 8px 1px rgba(233,201,138,0.8);
    }
    50%{
      transform: scale(1.4);
      box-shadow: 0 0 20px 5px rgba(233,201,138,0.9);
    }
  }

  .cta{
    animation: glow 4s ease-in-out infinite alternate;
  }

  /* ---------- Теги ---------- */

  .tags{
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2) var(--space-3);
    margin-top: var(--space-6);
    padding-top: var(--space-4);
    border-top: 1px solid rgba(242,217,192,0.1);
  }

  .tag{
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--champagne-soft);
    opacity: 0.85;
    letter-spacing: 0.01em;
  }

  .tag .marker{
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--gold);
    flex-shrink: 0;
  }

  /* ---------- Адаптив ---------- */

  @media (max-width: 480px){
    body{
      padding: var(--space-2);
      align-items: center;
    }
    .card{
      padding: var(--space-5) var(--space-3) var(--space-4);
      border-radius: 22px;
    }
    .name{ font-size: 40px; }
    .role{ font-size: 15px; margin: var(--space-3) 0 var(--space-4); }
    .cta{
      width: 100%;
      padding: 15px 24px;
    }
    .tags{
      gap: var(--space-2);
      margin-top: var(--space-5);
      padding-top: var(--space-3);
    }
  }

  @media (prefers-reduced-motion: reduce){
    *{
      transition: none !important;
      animation: none !important;
    }
  }
</style>
</head>
<body>

  <main class="card">
    <span class="eyebrow"><span class="dot"></span>Веб-дизайнер</span>

    <h1 class="name">
      Кадермятов
      <span class="last">Ханиф</span>
    </h1>

    <p class="role">Я создаю стильные сайты</p>

    <a
      class="cta"
      href="https://t.me/Hanif_kadermyatov"
      target="_blank"
      rel="noopener noreferrer"
    >
      Связаться
      <span class="arrow">→</span>
    </a>

    <div class="tags">
      <span class="tag"><span class="marker"></span>дизайн-система</span>
      <span class="tag"><span class="marker"></span>микро-анимация</span>
      <span class="tag"><span class="marker"></span>стекло &amp; шум</span>
    </div>
  </main>

</body>
</html>
